<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>PD Asset Scanner</title>


  <!-- QR SCANNER LIBRARY -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        sans-serif;

      background: #ffffff;

      text-align: center;

    }


    h1 {

      margin:
        10px 0 5px;

      font-size: 24px;

    }


    .subtitle {

      color: #777;

      margin-bottom: 25px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;

    }


    #status {

      max-width: 500px;

      margin: 20px auto;

      padding: 15px;

      border-radius: 10px;

      background: #f5f5f5;

      font-weight: bold;

      word-break: break-word;

    }


    #result {

      display: none;

      max-width: 500px;

      margin: 20px auto;

      padding: 20px;

      border-radius: 12px;

      background: #e8f5e9;

    }


    #resultText {

      margin-top: 10px;

      word-break: break-all;

    }

  </style>

</head>


<body>


  <h1>
    📦 PD Asset
  </h1>


  <div class="subtitle">

    Scan QR Code

  </div>


  <!-- CAMERA -->

  <div id="reader"></div>


  <!-- STATUS -->

  <div id="status">

    📷 Starting camera...

  </div>


  <!-- SCAN RESULT -->

  <div id="result">

    <strong>
      ✅ QR Code Detected
    </strong>

    <div id="resultText"></div>

  </div>


  <script>


    /*************************************************
     * SCANNER
     *************************************************/

    let scanner;

    let scanned = false;



    /*************************************************
     * QR SUCCESS
     *************************************************/

    function onScanSuccess(decodedText) {


      // Prevent duplicate scans

      if (scanned) {

        return;

      }


      scanned = true;


      // Update status

      document.getElementById(
        "status"
      ).innerText =
        "✅ QR berhasil terbaca. Opening asset...";


      // Show scanned result

      document.getElementById(
        "result"
      ).style.display =
        "block";


      document.getElementById(
        "resultText"
      ).innerText =
        decodedText;


      /*
       * Stop camera first.
       *
       * After camera stops,
       * redirect to the URL inside QR.
       */

      scanner
        .stop()

        .then(function() {


          window.location.href =
            decodedText;


        })

        .catch(function(error) {


          console.log(
            "Scanner stop error:",
            error
          );


          // Even if camera cannot stop,
          // continue opening the URL.

          window.location.href =
            decodedText;

        });

    }



    /*************************************************
     * QR FAILURE
     *************************************************/

    function onScanFailure(error) {

      /*
       * Scanner will continue scanning.
       *
       * Small scanning errors are ignored.
       */

    }



    /*************************************************
     * START CAMERA
     *************************************************/

    function startScanner() {


      scanner =
        new Html5Qrcode(
          "reader"
        );


      scanner
        .start(

          {
            facingMode:
              "environment"
          },


          {

            fps: 10,


            qrbox: {

              width: 250,

              height: 250

            }

          },


          onScanSuccess,

          onScanFailure

        )


        .then(function() {


          document.getElementById(
            "status"
          ).innerText =
            "📷 Camera active — arahkan ke QR";


        })


        .catch(function(error) {


          console.error(
            error
          );


          document.getElementById(
            "status"
          ).innerText =
            "❌ Camera error: " +
            error;

        });

    }



    /*************************************************
     * START
     *************************************************/

    window.addEventListener(
      "load",
      startScanner
    );


  </script>


</body>
</html>
